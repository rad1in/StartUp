<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>آفلاین | ET-Cafe</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Vazirmatn, Tahoma, sans-serif;
        background: radial-gradient(80rem 50rem at 80% -10%, rgba(201, 146, 47, 0.18), transparent 55%),
          linear-gradient(170deg, #26241f, #141210);
        color: #fdfcf8;
        text-align: center;
      }
      .box {
        padding: 40px 28px;
        max-width: 340px;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: 22px;
        margin: 24px 0 8px;
      }
      p {
        color: rgba(253, 252, 248, 0.6);
        font-size: 14px;
        line-height: 1.9;
      }
      button {
        margin-top: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 999px;
        font: inherit;
        font-weight: 800;
        color: #fdfcf8;
        cursor: pointer;
        background: linear-gradient(180deg, #d9ab4b, #c9922f 55%, #ac7825);
        box-shadow: 0 8px 24px rgba(201, 146, 47, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" alt="" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>به نظر می‌رسد آفلاین هستید. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
