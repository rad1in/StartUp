<!doctype html>

  <head>

    <meta name="keywords" content="سفارش آنلاین کافه, منوی دیجیتال, اسکن QR میز, سفارش رستوران, ET-Cafe" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#141210" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ET-Cafe" />
    <title>ET-Cafe — سفارش آنلاین کافه و رستوران</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ET-Cafe" />
    <meta property="og:title" content="ET-Cafe — سفارش آنلاین کافه و رستوران" />
    <meta property="og:description" content="کشف کافه‌های اطراف، اسکن QR میز، سفارش و پرداخت آنلاین." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/icons/icon-512.png" />
    <meta property="og:locale" content="fa_IR" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ET-Cafe — سفارش آنلاین کافه و رستوران" />
    <meta name="twitter:description" content="کشف کافه‌های اطراف، اسکن QR میز، سفارش و پرداخت آنلاین." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/icons/icon-512.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ET-Cafe",
        "url": "%VITE_SITE_URL%/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "%VITE_SITE_URL%/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script>
      // Applied before first paint to avoid a light-mode flash on load.
      (function () {
        var saved = localStorage.getItem('et-cafe-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
      // Same idea for language direction — must mirror getInitialLang() in
      // context/LanguageContext.jsx. Without this the document would render
      // one frame as the hardcoded fa/rtl above before React corrects it,
      // which visibly flips the whole layout for English/Turkish visitors.
      (function () {
        var RTL = ['fa', 'ar'];
        var known = ['en', 'fa', 'ar', 'tr'];
        var saved = localStorage.getItem('et-cafe-lang');
        var lang = known.indexOf(saved) !== -1 ? saved : 'en';
        document.documentElement.lang = lang;
        document.documentElement.dir = RTL.indexOf(lang) !== -1 ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
